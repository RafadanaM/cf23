name: Deploy Site

on:
  push:
    branches: ['master']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install Deps
        run: bun install

      - name: Build Static Site
        run: |
          bun run build

      - name: Sync Static Site
        uses: burnett01/rsync-deployments@7.0.0
        with:
          switches: -avz --delete
          path: .output/public/
          remote_path: /var/www/cf23
          remote_host: ${{ secrets.HOST }}
          remote_user: ${{ secrets.HOST_USER }}
          remote_key: ${{ secrets.HOST_SSH_KEY }}

      - name: Sync Nginx Config
        uses: burnett01/rsync-deployments@7.0.0
        with:
          switches: -avz
          path: deploy/nginx/app.conf
          remote_path: /home/${{ secrets.HOST_USER }}/apps/cf23/cf23.rafadana.com.conf
          remote_host: ${{ secrets.HOST }}
          remote_user: ${{ secrets.HOST_USER }}
          remote_key: ${{ secrets.HOST_SSH_KEY }}

      - name: Apply, Test & Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_SSH_KEY }}
          script: |
            sudo cp /home/${{ secrets.HOST_USER }}/apps/cf23/cf23.rafadana.com.conf /etc/nginx/conf.d/cf23.rafadana.com.conf
            sudo nginx -t
            sudo systemctl reload nginx

      - name: Purge index.html
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          chmod +x ./scripts/purge_cache.sh
          ./scripts/purge_cache.sh
