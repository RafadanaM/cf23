# For running build in local
services:
  static-server:
    image: nginx:alpine
    ports:
      - '3000:80'
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.output/public:/usr/share/nginx/html:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
