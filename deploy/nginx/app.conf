map "$request_method:$uri" $api_cache_header {
    default                 "no-cache, no-store, must-revalidate, proxy-revalidate";
    "~^GET:/api/v1/circles" "public, max-age=1800, s-maxage=604800, stale-while-revalidate=86400";
}

server {
    server_name cf23.rafadana.com www.cf23.rafadana.com;
    listen 443 ssl;

    http2 on;
    add_header_inherit merge;

    # Static build output
    root /var/www/cf23;
    index index.html;

    # --- GZIP ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # --- SECURITY HEADERS ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- API PROXY ---
    location /api/ {

        proxy_pass http://127.0.0.1:5600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control $api_cache_header always;

    }


    # --- IMAGE PROXY ---
    location /images/ {

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;

    }

    # --- CACHING: HTML (1W on CDN, will be purged on every deploy) ---
    location ~* \.html$ {
        add_header Cache-Control "public, no-cache, max-age=0, s-maxage=604800, stale-while-revalidate=86400";
        etag on;
        try_files $uri $uri.html $uri/ =404;
    }

    # --- DONT CACHE SW ---
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate";
    }

    # --- CACHING: static assets (30 days) ---
    location ~* \.(?:js|css|webp|png|jpg|jpeg|gif|ico|svg|woff2?|json|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # --- MAIN ROUTING ---
    location / {
        try_files $uri $uri.html $uri/ =404;
    }


    # --- CUSTOM 404 ---
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }


    ssl_certificate /etc/letsencrypt/live/cf23.rafadana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cf23.rafadana.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.cf23.rafadana.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = cf23.rafadana.com) {
        return 301 https://$host$request_uri;
    }

    server_name cf23.rafadana.com www.cf23.rafadana.com;
    listen 80;
    return 404;
}
